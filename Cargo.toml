[workspace]
resolver = "3"
members = [
    "crates/ipkvm-core",
    "crates/ipkvm-video",
    "crates/ipkvm-session",
    "crates/ipkvm-rfb",
    "crates/ipkvm-desktop",
    "crates/ipkvm-desktop-iced",
    "crates/ipkvm-headless",
]
exclude = ["third_party/iced_aw"]

[patch.crates-io]
# iced_aw 0.14.1 vendored + 本地最小补丁（嵌套子菜单树状态 bug，见
# third_party/iced_aw/PATCHES.md）。0.15 正式版发布后重新评估。
iced_aw = { path = "third_party/iced_aw" }

[workspace.package]
edition = "2024"
license = "MIT"
repository = "http://10.10.10.5:3000/kxn/my_ipkvm"
rust-version = "1.89"

[workspace.dependencies]
arboard = "3.6.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
cipher = "0.4"
des = "0.8"
futures-util = "0.3.33"
iced_aw = { version = "0.14.1", default-features = false, features = ["menu"] }
include_dir = { version = "0.7.4", default-features = false }
jpeg-encoder = "0.6"
proptest = "1"
rand = "0.9"
# serialport：跨平台串口（CH9329 通信）。MPL-2.0（文件级 copyleft，仅链接使用无需开源
# 自身代码，保留其许可证声明即可）。例外见 deny.toml 与 docs/dependency-license-policy.md。
serialport = { version = "4.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
toml = "0.9"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
windows = { version = "0.61", default-features = false }
zune-jpeg = "0.5"
