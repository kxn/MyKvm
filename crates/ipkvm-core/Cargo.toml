[package]
name = "ipkvm-core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
# serialport 仅在 serial feature 下启用（CH9329 真实串口通信）。
serialport = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[features]
default = []
test-support = []
# 历史兼容别名；新 target 使用 test-support。
mock = ["test-support"]
# 真实串口后端：SerialCommandQueue（实现 CommandQueue，把 CH9329 帧写入串口设备）。
serial = ["dep:serialport"]

[[example]]
name = "ch9329_probe"
required-features = ["serial"]
