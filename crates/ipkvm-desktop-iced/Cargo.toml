[package]
name = "ipkvm-desktop-iced"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
iced = { version = "0.14", features = ["tokio", "image", "advanced"] }

[dev-dependencies]
iced_test = "0.14"

[[bin]]
name = "ipkvm-desktop-iced"
path = "src/main.rs"

[lib]
name = "ipkvm_desktop_iced"
path = "src/lib.rs"
