[package]
name = "ipkvm-desktop-iced"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
arboard.workspace = true
async-stream = "0.3"
futures-util = { workspace = true }
iced = { version = "0.14", features = ["tokio", "image", "advanced"] }
iced_aw.workspace = true
iced_futures = "0.14"
ipkvm-core = { path = "../ipkvm-core", features = ["serial"] }
ipkvm-desktop = { path = "../ipkvm-desktop" }
ipkvm-desktop-core = { path = "../ipkvm-desktop-core" }
ipkvm-session = { path = "../ipkvm-session" }
ipkvm-video = { path = "../ipkvm-video", features = ["camera", "test-support"] }
rust-i18n = "4.2.1"
sys-locale = "0.3.2"

[dev-dependencies]
iced_test = "0.14"
iced_runtime = "0.14"
iced_tiny_skia = { version = "0.14", default-features = false }
ipkvm-video = { path = "../ipkvm-video", features = ["test-support"] }
# 仅测试用：编码小尺寸 JPEG 作为 MJPEG 帧数据，避免引入二进制 fixture 文件。
jpeg-encoder.workspace = true
tiny-skia = "0.11"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
rfd = { version = "0.15.4", default-features = false, features = ["common-controls-v6"] }

# macOS：原生文件对话框（rfd 0.15.4 自带 objc2 后端，无额外 feature；
# Linux 的 xdg-portal/ashpd 依赖均为 Linux target 限定，default-features = false 避免误拉）。
[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.15.4", default-features = false }

[[bin]]
name = "ipkvm-desktop-iced"
path = "src/main.rs"

[lib]
name = "ipkvm_desktop_iced"
path = "src/lib.rs"

[build-dependencies]
embed-resource = "3.0.11"

[[example]]
name = "video_1080p"
path = "examples/video_1080p.rs"
