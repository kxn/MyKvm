[package]
name = "ipkvm-desktop-iced"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-stream = "0.3"
futures-util = { workspace = true }
iced = { version = "0.14", features = ["tokio", "image", "advanced"] }
iced_futures = "0.14"
ipkvm-core = { path = "../ipkvm-core" }
ipkvm-desktop = { path = "../ipkvm-desktop" }
ipkvm-session = { path = "../ipkvm-session" }
ipkvm-video = { path = "../ipkvm-video", features = ["mock"] }
rust-i18n = "4.2.1"
sys-locale = "0.3.2"

[dev-dependencies]
iced_test = "0.14"
ipkvm-video = { path = "../ipkvm-video", features = ["mock"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "ipkvm-desktop-iced"
path = "src/main.rs"

[lib]
name = "ipkvm_desktop_iced"
path = "src/lib.rs"

[[example]]
name = "video_1080p"
path = "examples/video_1080p.rs"
