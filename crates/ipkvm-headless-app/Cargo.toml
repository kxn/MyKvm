[package]
name = "ipkvm-headless-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ipkvm-core = { path = "../ipkvm-core", features = ["serial", "test-support"] }
ipkvm-device = { path = "../ipkvm-device", features = ["platform"] }
ipkvm-headless = { path = "../ipkvm-headless" }
ipkvm-video = { path = "../ipkvm-video", features = ["assets", "camera", "test-support"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
axum.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tokio-tungstenite.workspace = true
tokio = { workspace = true, features = ["process"] }

[[bin]]
name = "ipkvm-headless"
path = "src/main.rs"
