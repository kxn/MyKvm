<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyKvm 控制台</title>
    <script>
      // 首屏防闪烁：在样式表生效前同步确定主题；
      // 决策逻辑必须与 /assets/modules/theme.js 保持一致。
      (() => {
        const stored = localStorage.getItem("my_ipkvm.theme");
        const choice = stored === "dark" || stored === "light" ? stored : "system";
        document.documentElement.dataset.theme =
          choice === "system"
            ? window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : choice;
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23333'/><text x='50' y='68' font-family='Arial,sans-serif' font-size='60' font-weight='bold' fill='%234ade80' text-anchor='middle'>K</text></svg>"
    >
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <main id="console" data-connection-state="connecting" data-view="connection" data-bar-pinned="false">
      <header id="control-bar" aria-label="控制台操作">
        <div class="bar-group">
          <div class="menu-anchor">
            <button
              id="session-menu-button"
              class="bar-button session-button"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              data-i18n-title="bar.session"
              title="会话"
            >
              <span class="status-indicator" aria-hidden="true"></span>
              <span id="control-target" class="session-name">MyKvm</span>
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div id="session-menu" class="menu-panel" hidden>
              <div
                id="connection-status"
                class="menu-status"
                role="status"
                aria-live="polite"
                data-i18n="status.unknown"
              >正在获取状态</div>
              <button id="bar-reconnect" type="button" data-i18n="bar.reconnect">重新连接</button>
              <button id="toolbar-disconnect" type="button" disabled data-i18n="toolbar.disconnect">
                断开
              </button>
            </div>
          </div>
        </div>
        <span class="bar-divider" aria-hidden="true"></span>
        <div class="bar-group">
          <div class="menu-anchor">
            <button
              id="special-keys-button"
              class="bar-button"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="1.5" y="3.5" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="M4 6.5h1M7 6.5h1M10 6.5h1M12 6.5h.5M4 9h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
              <span data-i18n="toolbar.specialKeys">特殊键</span>
            </button>
            <div id="special-keys-menu" class="menu-panel" hidden></div>
          </div>
          <button id="paste-button" class="bar-button" type="button">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="3.5" y="3" width="9" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M6 3V2a1 1 0 011-1h2a1 1 0 011 1v1" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M6 7.5h4M6 10h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span data-i18n="clipboard.paste">粘贴</span>
          </button>
        </div>
        <span class="bar-divider" aria-hidden="true"></span>
        <div class="bar-group">
          <button id="relative-mode" class="bar-button" type="button" disabled>
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="4.5" y="1.5" width="7" height="13" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M8 4v2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span class="label" data-i18n="video.relative">相对模式</span>
          </button>
          <label class="bar-slider" data-i18n-title="bar.sensitivity" title="相对灵敏度">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2 12L14 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <circle cx="8.5" cy="7.5" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            <input
              id="relative-sensitivity-slider"
              type="range"
              min="0.1"
              max="5"
              step="0.1"
              value="1"
              aria-label="相对灵敏度"
            >
            <span id="sensitivity-value">1.0</span>
          </label>
          <label class="bar-select" data-i18n-title="settings.mouseProfile" title="目标端兼容 profile">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.5" y="2.5" width="13" height="8.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M6 13.5h4M8 11v2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <select id="video-mouse-profile" aria-label="目标端兼容 profile">
              <option value="windows" data-i18n="settings.profileWindows">Windows</option>
              <option value="linux" data-i18n="settings.profileLinux">Linux</option>
              <option value="bios" data-i18n="settings.profileBios">BIOS</option>
              <option value="android" data-i18n="settings.profileAndroid">Android</option>
              <option value="macos" data-i18n="settings.profileMacos">macOS</option>
              <option value="raw_absolute" selected data-i18n="settings.profileRawAbsolute">原始绝对坐标</option>
              <option value="raw_relative" data-i18n="settings.profileRawRelative">原始相对坐标</option>
            </select>
          </label>
        </div>
        <span class="bar-divider" aria-hidden="true"></span>
        <div class="bar-group">
          <div class="menu-anchor">
            <button
              id="screenshot-button"
              class="bar-button"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
            >
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="1.5" y="4" width="13" height="9.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <circle cx="8" cy="8.7" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
                <path d="M6 4l1-1.5h2L10 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              </svg>
              <span data-i18n="toolbar.screenshot">截图</span>
            </button>
            <div id="screenshot-menu" class="menu-panel" hidden>
              <button id="save-screenshot" type="button" data-i18n="screenshot.save">保存截图</button>
              <button id="copy-screenshot" type="button" data-i18n="screenshot.copy">复制截图</button>
            </div>
          </div>
          <button
            id="scale-mode-button"
            class="bar-button"
            type="button"
            data-i18n-title="bar.scaleMode"
            title="缩放模式"
          >
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.5" y="3" width="13" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path d="M5 8h6M8.5 5.5L11 8l-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="scale-mode-label"></span>
          </button>
          <button
            id="fullscreen-button"
            class="bar-button icon-only"
            type="button"
            data-i18n-title="bar.fullscreen"
            title="全屏"
          >
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <span class="bar-divider" aria-hidden="true"></span>
        <div class="bar-group">
          <div class="menu-anchor">
            <button
              id="more-button"
              class="bar-button icon-only"
              type="button"
              aria-haspopup="true"
              aria-expanded="false"
              data-i18n-title="bar.more"
              title="更多"
            >
              <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="3" cy="8" r="1.4" fill="currentColor"/>
                <circle cx="8" cy="8" r="1.4" fill="currentColor"/>
                <circle cx="13" cy="8" r="1.4" fill="currentColor"/>
              </svg>
            </button>
            <div id="more-menu" class="menu-panel" hidden>
              <button id="status-panel-button" type="button" data-i18n="bar.statusMonitor">状态监控</button>
              <button id="open-settings" type="button" data-i18n="toolbar.settings">设置</button>
              <label class="menu-field">
                <span data-i18n="toolbar.theme">主题</span>
                <select id="theme-select">
                  <option value="system" data-i18n="theme.system">跟随系统</option>
                  <option value="dark" data-i18n="theme.dark">深色</option>
                  <option value="light" data-i18n="theme.light">浅色</option>
                </select>
              </label>
              <label class="menu-field">
                <span data-i18n="toolbar.language">语言</span>
                <select id="language-select">
                  <option value="browser" data-i18n="language.browser">跟随浏览器</option>
                  <option value="zh-CN" data-i18n="language.zh">中文</option>
                  <option value="en" data-i18n="language.en">English</option>
                </select>
              </label>
              <a href="/licenses/" target="_blank" rel="noreferrer" data-i18n="toolbar.licenses">许可证</a>
              <a href="https://github.com/kxn/MyKvm" target="_blank" rel="noreferrer" class="github-link">
                <svg class="icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                  <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                GitHub
              </a>
            </div>
          </div>
          <button
            id="bar-pin"
            class="bar-button icon-only"
            type="button"
            aria-pressed="false"
            data-i18n-title="bar.pin"
            title="固定控制条"
          >
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M9.5 1.8l4.7 4.7-1.6.3-2.5 2.5-.3 3-1.4 1.4-2.6-3.9-3 3-.7-.7 3-3-3.9-2.6 1.4-1.4 3-.3 2.5-2.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>

      <section id="connection-view" class="view connection-view" data-view="connection" aria-label="连接">
        <div class="connection-card">
          <h1 data-i18n="connection.title">连接远程主机</h1>
          <p id="connection-hint" class="hint" role="status" aria-live="polite"></p>
          <div class="device-picker">
            <label for="video-select" data-i18n="connection.video">视频设备</label>
            <select id="video-select"></select>
            <button id="refresh-video" type="button" data-i18n="connection.refresh">刷新</button>
            <span id="video-probe" class="probe" role="status"></span>
          </div>
          <div class="device-picker">
            <label for="serial-select" data-i18n="connection.serial">串口设备</label>
            <select id="serial-select"></select>
            <button id="refresh-serial" type="button" data-i18n="connection.refresh">刷新</button>
            <span id="serial-probe" class="probe" role="status"></span>
          </div>
          <div class="device-picker profile-picker">
            <label for="connection-mouse-profile" data-i18n="settings.mouseProfile">目标端兼容 profile</label>
            <select id="connection-mouse-profile">
              <option value="windows" data-i18n="settings.profileWindows">Windows</option>
              <option value="linux" data-i18n="settings.profileLinux">Linux</option>
              <option value="bios" data-i18n="settings.profileBios">BIOS</option>
              <option value="android" data-i18n="settings.profileAndroid">Android</option>
              <option value="macos" data-i18n="settings.profileMacos">macOS</option>
              <option value="raw_absolute" selected data-i18n="settings.profileRawAbsolute">原始绝对坐标</option>
              <option value="raw_relative" data-i18n="settings.profileRawRelative">原始相对坐标</option>
            </select>
          </div>
          <p id="connection-settings-summary" class="settings-summary"></p>
          <p id="connection-message" class="message" role="status" aria-live="polite"></p>
          <button id="connect-button" type="button" disabled data-i18n="connection.connect">
            连接
          </button>
        </div>
      </section>

      <section id="video-view" class="view video-view" data-view="video" hidden aria-label="远程画面">
        <div id="degraded-banner" class="degraded-banner" role="alert" hidden>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 1.5L15 13.5H1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M8 6v3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="8" cy="11.6" r="0.9" fill="currentColor"/>
          </svg>
          <span id="degraded-banner-text"></span>
        </div>
        <div id="screen" aria-label="远程控制台"></div>
        <footer id="video-status-bar" class="status-line">
          <span id="video-resolution"></span>
          <span id="video-fps"></span>
          <span id="status-profile"></span>
        </footer>
        <p id="video-message" class="message video-message" role="status" aria-live="polite"></p>
      </section>

      <div id="settings-modal" class="modal" hidden>
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <h2 id="settings-title" data-i18n="settings.title">设置</h2>
          <p id="settings-message" class="message" role="status" aria-live="polite"></p>
          <form id="settings-form">
            <label class="field">
              <span data-i18n="settings.baudRate">波特率</span>
              <input
                id="setting-baud-rate"
                type="number"
                min="1200"
                max="115200"
                step="1"
                required
              >
            </label>
            <label class="field field-check">
              <input id="setting-auto-baud" type="checkbox">
              <span data-i18n="settings.autoBaud">自动波特率</span>
            </label>
            <label class="field">
              <span data-i18n="settings.previewFps">预览帧率</span>
              <input
                id="setting-preview-fps"
                type="number"
                min="1"
                max="60"
                step="1"
                required
              >
            </label>
            <label class="field">
              <span data-i18n="settings.mouseMode">默认鼠标模式</span>
              <select id="setting-mouse-mode">
                <option value="absolute" data-i18n="settings.absolute">绝对</option>
                <option value="relative" data-i18n="settings.relative">相对</option>
              </select>
            </label>
            <label class="field">
              <span data-i18n="settings.mouseProfile">目标端兼容 profile</span>
              <select id="setting-mouse-profile">
                <option value="windows" data-i18n="settings.profileWindows">Windows</option>
                <option value="linux" data-i18n="settings.profileLinux">Linux</option>
                <option value="bios" data-i18n="settings.profileBios">BIOS</option>
                <option value="android" data-i18n="settings.profileAndroid">Android</option>
                <option value="macos" data-i18n="settings.profileMacos">macOS</option>
                <option value="raw_absolute" selected data-i18n="settings.profileRawAbsolute">原始绝对坐标</option>
                <option value="raw_relative" data-i18n="settings.profileRawRelative">原始相对坐标</option>
              </select>
            </label>
            <label class="field">
              <span data-i18n="settings.relativeSensitivity">相对灵敏度</span>
              <input
                id="setting-relative-sensitivity"
                type="number"
                min="0.1"
                max="5.0"
                step="0.1"
                required
              >
            </label>
            <label class="field">
              <span data-i18n="settings.scaleMode">缩放模式</span>
              <select id="setting-scale-mode">
                <option value="fit_window" data-i18n="settings.fitWindow">适配窗口</option>
                <option value="original" data-i18n="settings.original">原始大小</option>
                <option value="follow_window" data-i18n="settings.followWindow">窗口跟随视频</option>
              </select>
            </label>
          </form>
          <div class="modal-actions">
            <button id="settings-reset" type="button" data-i18n="settings.reset">恢复默认值</button>
            <span class="spacer"></span>
            <button id="settings-cancel" type="button" data-i18n="settings.cancel">取消</button>
            <button id="settings-save" type="button" data-i18n="settings.save">保存</button>
          </div>
        </div>
      </div>

      <div id="paste-modal" class="modal" hidden>
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="paste-title">
          <h2 id="paste-title" data-i18n="clipboard.title">粘贴文本</h2>
          <p id="paste-hint" class="message" role="status" aria-live="polite"></p>
          <textarea
            id="paste-text"
            rows="8"
            spellcheck="false"
            data-i18n-placeholder="clipboard.placeholder"
            placeholder="输入或确认要发送到远程主机的文本"
          ></textarea>
          <div class="paste-meta">
            <span id="paste-count"></span>
            <span id="paste-warning" class="paste-warning" hidden></span>
          </div>
          <div class="modal-actions">
            <span class="spacer"></span>
            <button id="paste-cancel" type="button" data-i18n="settings.cancel">取消</button>
            <button id="paste-send" type="button" class="primary" data-i18n="clipboard.send">
              发送
            </button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
