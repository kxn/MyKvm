[package]
name = "ipkvm-headless"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
include_dir.workspace = true
ipkvm-core = { path = "../ipkvm-core" }
ipkvm-rfb = { path = "../ipkvm-rfb" }
ipkvm-session = { path = "../ipkvm-session" }
ipkvm-video = { path = "../ipkvm-video" }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal"] }

[dev-dependencies]
futures-util.workspace = true
ipkvm-core = { path = "../ipkvm-core", features = ["mock"] }
ipkvm-video = { path = "../ipkvm-video", features = ["mock"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true

[[bin]]
name = "ipkvm-headless"
path = "src/main.rs"

[features]
default = []
demo = ["ipkvm-core/mock", "ipkvm-video/mock"]

[[bin]]
name = "ipkvm-demo"
path = "src/bin/ipkvm-demo.rs"
required-features = ["demo"]
