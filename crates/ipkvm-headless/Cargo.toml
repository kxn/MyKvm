[package]
name = "ipkvm-headless"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autobins = false

[dependencies]
axum = { workspace = true, features = ["json"] }
include_dir.workspace = true
ipkvm-core = { path = "../ipkvm-core" }
ipkvm-device = { path = "../ipkvm-device" }
ipkvm-rfb = { path = "../ipkvm-rfb" }
ipkvm-session = { path = "../ipkvm-session" }
ipkvm-video = { path = "../ipkvm-video" }
jpeg-encoder.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal"] }

[dev-dependencies]
des.workspace = true
futures-util.workspace = true
ipkvm-core = { path = "../ipkvm-core", features = ["test-support"] }
ipkvm-video = { path = "../ipkvm-video", features = ["assets", "test-support"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "test-util"] }
tokio-tungstenite.workspace = true
zune-jpeg.workspace = true

[features]
default = []
