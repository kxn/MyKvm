[package]
name = "ipkvm-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# 历史兼容别名：设备枚举已迁出，本 feature 不再拉入任何硬件依赖。
serial = []

[dependencies]
ipkvm-core = { path = "../ipkvm-core" }
ipkvm-rfb = { path = "../ipkvm-rfb" }
ipkvm-video = { path = "../ipkvm-video" }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync"] }

[dev-dependencies]
cipher.workspace = true
des.workspace = true
ipkvm-core = { path = "../ipkvm-core", features = ["test-support"] }
ipkvm-video = { path = "../ipkvm-video", features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
