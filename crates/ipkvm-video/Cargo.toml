[package]
name = "ipkvm-video"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

# Windows DirectShow 后端依赖。仅在 Windows target 启用（windows crate 在非 Windows
# 平台编译会失败：windows-future 引用了仅 Windows 生成的 IMarshal 符号）。
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Media_MediaFoundation",
    "Win32_Media_DirectShow",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
] }
windows-core = { version = "0.61", optional = true }
windows-interface = { version = "0.59.3", optional = true }
windows-implement = { version = "0.60.2", optional = true }

# nokhwa：Linux(V4L2)/macOS(AVFoundation) 跨平台相机后端。仅在非 Windows 平台启用
# （Windows 上 OBS 虚拟摄像头等列不出来，故 Windows 用自研 DirectShow sink filter）。
# 关闭默认特性（decoding 含 mjpeg 解码），仅在目标平台按 backend feature 启用。
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
nokhwa = { version = "0.10", optional = true, default-features = false, features = [
    "input-v4l",
    "decoding",
] }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10", optional = true, default-features = false, features = [
    "input-avfoundation",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []
camera = [
    "dep:windows",
    "dep:windows-core",
    "dep:windows-interface",
    "dep:windows-implement",
    "dep:nokhwa",
]
assets = []
test-support = []
# 相机后端 feature（命名沿用历史 mf）：
# - Windows：自研 DirectShow 纯 sink filter（windows crate）
# - Linux：nokhwa V4L2 后端
# - macOS：nokhwa AVFoundation 后端
# 各平台只拉自己 target-specific 的可选依赖；非该平台的 dep: 名被 Cargo 自动忽略。
mf = ["camera"]
# 历史兼容别名：旧调用方一次启用测试 mock 与 Y4M/file demo 能力。
mock = ["assets", "test-support"]

[[example]]
name = "camera_probe"
required-features = ["camera"]
