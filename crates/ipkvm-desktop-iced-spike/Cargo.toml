[package]
name = "ipkvm-desktop-iced-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-stream = "0.3"
futures-util = { workspace = true }
iced = { version = "0.14", features = ["tokio", "image", "advanced"] }
iced_futures = "0.14"
ipkvm-core = { path = "../ipkvm-core" }
ipkvm-desktop = { path = "../ipkvm-desktop" }
ipkvm-session = { path = "../ipkvm-session" }
ipkvm-video = { path = "../ipkvm-video", features = ["mock"] }
rust-i18n = "4.2.1"
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
iced_test = "0.14"
ipkvm-video = { path = "../ipkvm-video", features = ["mock"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "video_1080p_spike"
path = "examples/video_1080p.rs"
