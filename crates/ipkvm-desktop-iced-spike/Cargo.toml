[package]
name = "ipkvm-desktop-iced-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
iced_aw = { version = "0.14", default-features = false, features = ["menu"] }
ipkvm-core = { path = "../ipkvm-core" }
ipkvm-desktop = { path = "../ipkvm-desktop" }
ipkvm-session = { path = "../ipkvm-session" }
ipkvm-video = { path = "../ipkvm-video", features = ["mock"] }
rust-i18n = "4.2.1"
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", default-features = false }

[dev-dependencies]
iced_test = "0.14"
ipkvm-video = { path = "../ipkvm-video", features = ["mock"] }

[[example]]
name = "video_1080p"
path = "examples/video_1080p.rs"
