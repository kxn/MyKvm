[graph]
all-features = true

[licenses]
# 全局列表只放无需逐包审查的宽松许可证。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.93
include-dev = true
unused-allowed-license = "allow"

[licenses.private]
ignore = false

# 条件许可证的按包例外。例外 allow 列表取代该 crate 的全局允许列表，
# 因此 `A AND B` 表达式的所有组成许可证都要列入。合规记录见
# docs/dependency-license-policy.md「按组件审查」。
# jpeg-encoder 0.6.1 起许可证表达式为 (MIT OR Apache-2.0) AND IJG：
# DCT 实现移植自 mozjpeg/IJG jpeglib，IJG 为宽松许可证但要求产品文档致谢。
[[licenses.exceptions]]
name = "jpeg-encoder"
version = "0.6"
allow = ["MIT", "Apache-2.0", "IJG"]

# serialport 4.x：MPL-2.0（文件级弱 copyleft）。仅链接使用、未修改其源文件，
# 合规义务为在产品 NOTICE/文档中声明使用了 serialport 并保留其许可证声明。
# 其传递依赖（cfg-if/scopeguard/windows-sys）均为 MIT/Apache，已在全局允许列表内。
[[licenses.exceptions]]
name = "serialport"
version = "4.9"
allow = ["MPL-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://index.crates.io/",
]
unused-allowed-source = "allow"
