# cargo-make 统一任务入口（#7，#9 阶段 A）。
#
# 安装：cargo install --locked cargo-make
# 使用：cargo make <task>（无参数等价于 cargo make quick）
#
# 本文件是唯一流程编排层：quick/full 门禁链由任务依赖图直接定义，
# 不再经由 verify.ps1 / verify.sh 壳脚本中转。平台差异（ps1/sh）由
# 各任务内部按平台分支处理；实现逻辑仍在 scripts/ 下的原子脚本中
# （#9 阶段 B 将把双版本逻辑统一为跨平台 Python 单份实现）。

[config]
# 不加载 cargo-make 内置默认任务（预设的 build/test/audit 等），
# 避免与项目自定义任务名冲突。
skip_core_tasks = true
# 任务在 workspace 根目录运行，不向下分发到各 member crate。
default_to_workspace = false

[env]
# 仓库根目录（DuckScript 的 CARGO_MAKE_WORKING_DIRECTORY 在 workspace 根运行时即为根）。
SCRIPTS_DIR = "${CARGO_MAKE_WORKING_DIRECTORY}/scripts"

# ---------------------------------------------------------------------------
# 默认任务：cargo make（无参数）→ 快速门禁
# ---------------------------------------------------------------------------

[tasks.default]
dependencies = ["quick"]

# ---------------------------------------------------------------------------
# 快速门禁：编码/资产/许可/crate 边界/fmt/git diff，无全量编译
# ---------------------------------------------------------------------------

[tasks.quick]
description = "快速门禁（秒级~十秒级，无全量编译）"
dependencies = ["quick-checkers", "fmt", "diff-check"]

# 无依赖关系的检查并行执行（cargo-make run_task parallel）。
# licenses（cargo-deny 读 Cargo.lock）与 crate-boundaries（cargo metadata/tree）
# 均为只读 Cargo 元数据操作，互不冲突；文件类检查无共享状态。
[tasks.quick-checkers]
description = "并行执行无依赖的快速检查"
run_task = { name = ["text-encoding", "web-assets-policy", "web-assets-lock", "licenses", "crate-boundaries"], parallel = true }

[tasks.text-encoding]
description = "检查跟踪文本文件均为无 BOM 的合法 UTF-8"
script = '''
#!@duckscript
# Windows 用 py 启动器，其余平台用 python3（与既有脚本的解析模式一致）
if is_windows
    exec py ${SCRIPTS_DIR}/check-text-encoding.py
else
    exec python3 ${SCRIPTS_DIR}/check-text-encoding.py
end
'''

[tasks.web-assets-policy]
description = "测试 noVNC 资产策略（自测）"
script = '''
#!@duckscript
# 跨平台 Python 单份实现（#9 阶段 B1）
if is_windows
    exec py ${SCRIPTS_DIR}/test-web-assets.py
else
    exec python3 ${SCRIPTS_DIR}/test-web-assets.py
end
'''

[tasks.web-assets-lock]
description = "检查 web 资产与浏览器依赖锁"
script = '''
#!@duckscript
# 跨平台 Python 单份实现（#9 阶段 B1）
if is_windows
    exec py ${SCRIPTS_DIR}/verify-web-assets.py
else
    exec python3 ${SCRIPTS_DIR}/verify-web-assets.py
end
'''

[tasks.license-policy]
description = "测试依赖许可证策略（自测，变更 deny.toml / license_policy_tools.py 时运行）"
script = '''
#!@duckscript
# 跨平台 Python 单份实现（#9 阶段 B2）
# 工具自测：用临时正负向夹具验证 deny.toml 行为。不在 quick/full 门禁内，
# 真正的许可证门禁是 licenses（verify-licenses.py，含 cargo-deny 版本断言）。
if is_windows
    exec py ${SCRIPTS_DIR}/test-license-policy.py
else
    exec python3 ${SCRIPTS_DIR}/test-license-policy.py
end
'''

[tasks.licenses]
description = "检查依赖许可证与来源（cargo-deny）"
script = '''
#!@duckscript
# 跨平台 Python 单份实现（#9 阶段 B2）
if is_windows
    exec py ${SCRIPTS_DIR}/verify-licenses.py
else
    exec python3 ${SCRIPTS_DIR}/verify-licenses.py
end
'''

[tasks.crate-boundaries]
description = "检查 crate 依赖边界"
script = '''
#!@duckscript
# 跨平台 Python 单份实现（#9 阶段 B3）
if is_windows
    exec py ${SCRIPTS_DIR}/test-crate-boundaries.py
else
    exec python3 ${SCRIPTS_DIR}/test-crate-boundaries.py
end
'''

[tasks.fmt]
description = "检查 Rust 代码格式（只读）"
command = "cargo"
args = ["fmt", "--all", "--check"]

[tasks.fmt-fix]
description = "自动修复 Rust 代码格式"
command = "cargo"
args = ["fmt", "--all"]

[tasks.diff-check]
description = "检查工作树与暂存区 diff 空白错误"
dependencies = ["diff-check-tree", "diff-check-staged"]

[tasks.diff-check-tree]
private = true
command = "git"
args = ["diff", "--check"]

[tasks.diff-check-staged]
private = true
command = "git"
args = ["diff", "--cached", "--check"]

# ---------------------------------------------------------------------------
# 全量门禁：快速门禁 + workspace test/clippy/doc
# ---------------------------------------------------------------------------

[tasks.full]
description = "全量门禁（分钟级，含全量编译）"
dependencies = ["quick", "test", "clippy", "doc"]

# ---------------------------------------------------------------------------
# 环境敏感步骤：浏览器闭环（仅 Windows）
# ---------------------------------------------------------------------------

[tasks.browser]
description = "真实浏览器闭环（需要 Node 20+、Chrome/Edge、npm 联网）"
script = '''
#!@duckscript
# 跨平台 Python 单份实现（#9 阶段 B4）
if is_windows
    exec py ${SCRIPTS_DIR}/verify-browser.py
else
    exec python3 ${SCRIPTS_DIR}/verify-browser.py
end
'''

# ---------------------------------------------------------------------------
# 桌面 release 构建与启动冒烟（Windows/Linux，issue #37）
# ---------------------------------------------------------------------------

[tasks.desktop-release]
description = "构建 iced desktop release 并启动冒烟"
condition = { platforms = ["windows", "linux"] }
dependencies = ["build-desktop-release"]
script = '''
#!@duckscript
# Windows 走 ps1（窗口句柄 P/Invoke），Linux 走 sh（xdotool/xwininfo/xlsclients）。
if is_windows
    exec powershell -NoProfile -ExecutionPolicy Bypass -File ${SCRIPTS_DIR}/verify-desktop-release.ps1
else
    exec bash ${SCRIPTS_DIR}/verify-desktop-release.sh
end
'''

[tasks.build-desktop-release]
private = true
condition = { platforms = ["windows", "linux"] }
command = "cargo"
args = ["build", "--release", "-p", "ipkvm-desktop-iced", "--bin", "ipkvm-desktop-iced"]

# ---------------------------------------------------------------------------
# 粒度 cargo 命令（跨平台）
# ---------------------------------------------------------------------------

[tasks.test]
description = "全工作区测试（--all-features）"
command = "cargo"
args = ["test", "--workspace", "--all-features"]

[tasks.clippy]
description = "Clippy 检查（--all-targets --all-features -D warnings）"
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.doc]
description = "构建 Rust 文档（--all-features -D warnings）"
env = { RUSTDOCFLAGS = "-D warnings" }
command = "cargo"
args = ["doc", "--workspace", "--all-features", "--no-deps"]
