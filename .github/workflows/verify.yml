name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 必需 job（Windows）：全量门禁，作 main 分支保护 required status check。
  # 通过 cargo make full 统一入口，Makefile.toml 自动选择平台对应脚本。
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # cargo make full 的 licenses 步骤依赖 cargo-deny
      - run: cargo install --locked --version 0.20.2 cargo-deny
      - run: cargo install --locked cargo-make
      - run: cargo make full

  # 必需 job（Linux）：跨平台编译与静态检查覆盖，作 main 分支保护 required status check。
  # 与 Windows core 共用 Makefile.toml，自动选择 sh 版本脚本。
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked --version 0.20.2 cargo-deny
      - run: cargo install --locked cargo-make
      - run: cargo make full

  # 非阻塞 job：真实浏览器闭环，在 GitHub runner 上稳定跑绿后再改为必需
  browser:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: browser-actions/setup-chrome@v1
      - run: .\scripts\verify-browser.ps1
